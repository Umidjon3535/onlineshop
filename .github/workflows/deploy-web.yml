name: Veb-versiya

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Veb fayllarini yaratish
        run: |
          flutter create . --project-name online_shop --org uz.bozor --platforms web
          sed -i 's/"name": "[^"]*"/"name": "Bozor"/; s/"short_name": "[^"]*"/"short_name": "Bozor"/' web/manifest.json
          sed -i 's|<title>.*</title>|<title>Bozor</title>|; s|apple-mobile-web-app-title" content="[^"]*"|apple-mobile-web-app-title" content="Bozor"|' web/index.html

      - run: flutter pub get
      - run: flutter build web --release --base-href /onlineshop/ --no-web-resources-cdn

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web

      # Vercel saytning ildizidan ochiladi, shuning uchun alohida tarmoqqa joylanadi
      - name: Vercel uchun nusxa tayyorlash
        run: |
          sed -i 's|<base href="/onlineshop/">|<base href="/">|' build/web/index.html
          echo '{"cleanUrls":false,"framework":null,"buildCommand":"","installCommand":"","outputDirectory":"."}' > build/web/vercel.json

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          publish_branch: vercel-site
